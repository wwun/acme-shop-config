server:
  port: 8001

spring:
  data:
    redis:
      host: redis
      port: 6379
      timeout: 6000

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka

resilience4j:
  circuitbreaker:
    instances:
      products:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimun-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
  retry:
    instances:
      products:
        max-attemps: 3
        wait-duration: 200ms

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false
  show-actuator: true

jwt:
  secret: aVeryLongSecretKeyThatIsAtLeast32Chars!!
  expiration: 900000
