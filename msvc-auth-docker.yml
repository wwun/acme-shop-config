server:
  port: 8001

spring:
  application:
    name: msvc-auth
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 1072666433714-ohe6bue7h1bjeamcijs9ecdjli83i7f4.apps.googleusercontent.com
            client-secret: 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
            scope:
              - openid
              - profile
              - email
            redirect-uri: "${OAUTH2_REDIRECT_URI}"
            #"{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            issuer-uri: https://accounts.google.com

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka

resilience:
  circuitbreaker:
    instances:
      users:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
  retry:
    instances:
      users:
        max-attemps: 3
        wait-duration: 200ms

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false
  show-actuator: true

jwt:
  expiration: 900000
  secret: aVeryLongSecretKeyThatIsAtLeast32Chars!!

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

